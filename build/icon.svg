<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2260"/><stop offset=".55" stop-color="#22123a"/><stop offset="1" stop-color="#140a22"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".22" r=".75">
      <stop offset="0" stop-color="#b48cff" stop-opacity=".55"/><stop offset=".6" stop-color="#7a4fe0" stop-opacity=".12"/><stop offset="1" stop-color="#7a4fe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4d2ff"/><stop offset=".45" stop-color="#b69cff"/><stop offset=".75" stop-color="#f0b8ff"/><stop offset="1" stop-color="#cdd6ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="core" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#f5efe1"/><stop offset="1" stop-color="#d9b8ff"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <!-- atom: three orbits around a glowing core -->
  <g transform="translate(256 256)" fill="none" stroke="url(#orbit)" stroke-width="18" stroke-linecap="round">
    <g filter="url(#soft)" opacity=".75">
      <ellipse rx="170" ry="66"/><ellipse rx="170" ry="66" transform="rotate(60)"/><ellipse rx="170" ry="66" transform="rotate(-60)"/>
    </g>
    <ellipse rx="170" ry="66"/><ellipse rx="170" ry="66" transform="rotate(60)"/><ellipse rx="170" ry="66" transform="rotate(-60)"/>
  </g>
  <g transform="translate(256 256)">
    <circle r="40" fill="#f0b8ff" opacity=".35" filter="url(#soft)"/>
    <circle r="30" fill="url(#core)"/>
    <circle cx="170" cy="0" r="17" fill="#f5efe1"/>
    <circle cx="-85" cy="147" r="17" fill="#f5efe1"/>
    <circle cx="-85" cy="-147" r="17" fill="#f5efe1"/>
  </g>
</svg>
